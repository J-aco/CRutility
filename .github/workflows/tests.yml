name: Tests

on:
  push:
    branches: [main]
    paths:
      - '**/*.js'
  pull_request:
    branches: [main]
    paths:
      - '**/*.js'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run tests
        run: npm test
